<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Scan BCA credit card registration numbers on-device.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FOCR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FOCR</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- On-device OCR for web; assets are self-hosted (tool/fetch_tesseract_assets.sh). -->
  <script src="tesseract/tesseract.min.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Offline support (web/sw.js). Once Flutter has drawn its first frame, tell the worker which
    // same-origin files this page actually loaded (the engine variant differs per browser), so
    // they are cached for offline use.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
        const cacheLoadedFiles = () => {
          const urls = performance.getEntriesByType('resource')
            .map((e) => e.name.split('#')[0])
            .filter((u) => u.startsWith(location.origin));
          reg.active && reg.active.postMessage({ type: 'cache-urls', urls });
        };
        window.addEventListener('flutter-first-frame', () => {
          cacheLoadedFiles();
          setTimeout(cacheLoadedFiles, 5000); // fonts and late assets
        });
        setTimeout(cacheLoadedFiles, 15000); // fallback if the event was missed
      }).catch((e) => console.warn('FOCR: service worker registration failed', e));
    }
  </script>
</body>
</html>
