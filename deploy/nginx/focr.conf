# nginx site config for the FOCR web app (Flutter web, static files only).
# Goes in the http{} context (e.g. /etc/nginx/conf.d/). Web root: the `public/` folder of the
# release package.
# TLS is expected to be terminated in front of this (load balancer / ingress / reverse proxy).
# The app needs HTTPS for the camera and the offline service worker.

# Caching per path. Flutter file names are not content-hashed, so the app shell (index.html,
# main.dart.js, sw.js, ...) must always be revalidated; large versioned engines can be cached.
map $uri $focr_cache_control {
    default             "no-cache";
    ~^/canvaskit/       "public, max-age=604800";
    ~^/tesseract/       "public, max-age=2592000";
    ~^/assets/          "public, max-age=86400";
    ~^/icons/           "public, max-age=86400";
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compression for text and wasm. *.gz files are NOT re-compressed (their type is not listed).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # Defined here only. A location that has its own add_header would drop all of these.
    add_header Cache-Control $focr_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Flutter rendering engine. .wasm must be served as application/wasm.
    location /canvaskit/ {
        types {
            application/javascript js;
            application/wasm       wasm;
        }
    }

    # Tesseract OCR language data: send the .gz bytes AS-IS.
    # Do NOT add "Content-Encoding: gzip" here: the OCR engine unzips it itself, and the browser
    # unzipping it first breaks OCR.
    location /tesseract/lang/ {
        types { }
        default_type application/octet-stream;
        gzip off;
    }

    # Single-page app: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
